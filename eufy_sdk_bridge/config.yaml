# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-configuration
name: eufy-sdk bridge
version: "0.1.0"
slug: eufy_sdk_bridge
description: Runs the ha-eufy-sdk bridge (WS control + HTTP video + go2rtc) for the eufy-sdk HACS integration.
url: "https://github.com/mega-yfue/ha-eufy-sdk-addon/tree/main/eufy_sdk_bridge"
# The bridge image is multi-arch; keep this list in sync with what the bridge publishes.
arch:
  - aarch64
  - amd64
  - armv7
init: false
# Ingress fronts the bridge's WS/HTTP on :3000 and supplies the auth the raw WS lacks.
ingress: true
ingress_port: 3000
panel_icon: mdi:cctv
# go2rtc's own ports for RTSP / WebRTC / MSE. Host these so a camera stream reaches the LAN.
ports:
  1984/tcp: 1984
  8554/tcp: 8554
  8555/tcp: 8555
  8555/udp: 8555
ports_description:
  1984/tcp: go2rtc API / WebRTC
  8554/tcp: RTSP
  8555/tcp: WebRTC (TCP)
  8555/udp: WebRTC (UDP)
options:
  email: ""
  password: ""
  country: GB
schema:
  email: str
  password: password
  country: str
