# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-configuration
name: eufy-sdk bridge (wired)
version: "0.3.3"
slug: eufy_sdk_bridge_wired
description: Runs the ha-eufy-sdk bridge with an optional wired-stream override for selected devices.
url: "https://github.com/dennishartman/ha-eufy-sdk-addon/tree/main/eufy_sdk_bridge"
# No image is specified: Home Assistant builds this customized add-on locally from the Dockerfile.
arch:
  - aarch64
  - amd64
init: false
# The entrypoint registers dynamic Supervisor discovery after reading this add-on's current network
# mapping, so Home Assistant receives only the host plus remapped bridge and RTSP ports.
hassio_api: true
discovery:
  - eufy_sdk
# Ingress fronts the bridge's WS/HTTP on :3000 and supplies the auth the raw WS lacks.
ingress: true
ingress_port: 3000
panel_icon: mdi:cctv
# Publish only the ports the Home Assistant integration consumes: bridge control and RTSP.
ports:
  3000/tcp: 3000
  8554/tcp: 8554
ports_description:
  3000/tcp: Bridge WS + HTTP control (point the eufy-sdk integration here)
  8554/tcp: RTSP
options:
  email: ""
  password: ""
  country: GB
  # Optional tuning — these mirror the bridge's own defaults, so leaving them is a no-op.
  poll_ms: 600000
  stream_idle_ms: 300000
  rtsp_idle_off_ms: 300000
  prewarm: false
  event_log: true
  debug: false
  debug_p2p: false
  # Comma-separated serials that should bypass the SDK battery stream budget. Keep this value local.
  force_wired_serials: ""
  # Compatibility mode for cameras whose 64,000-byte continuation begins with a fresh H.264 start code.
  treat_64000_as_complete: false
  # ── Anker Solix (optional; a SEPARATE Anker account from eufy) ──────────────────────────────────
  solix_email: ""
  solix_password: ""
  solix_country: ""
  solix_scene_poll_ms: 90000
  solix_retry_base_ms: 900000
  solix_retry_max_ms: 3600000
schema:
  email: str
  password: password
  country: str
  poll_ms: int(0,)
  stream_idle_ms: int(0,)
  rtsp_idle_off_ms: int(0,)
  prewarm: bool
  event_log: bool
  debug: bool
  debug_p2p: bool
  # Optional comma-separated device serials. They are passed only at runtime, never baked into the image.
  force_wired_serials: "str?"
  # Join matching split units by timestamp/sequence even when their continuation has a start code.
  treat_64000_as_complete: bool
  solix_email: "str?"
  solix_password: "password?"
  solix_country: "str?"
  solix_scene_poll_ms: "int(5000,)?"
  solix_retry_base_ms: "int(10000,)?"
  solix_retry_max_ms: "int(10000,)?"
