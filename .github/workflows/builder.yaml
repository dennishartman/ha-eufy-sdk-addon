name: Builder

# Build the add-on images with the official Home Assistant builder, run as a Docker image via the
# CLI. That keeps the only `uses:` action GitHub-owned (actions/checkout), so the org's "actions must
# be mega-yfue-owned or GitHub-created" policy doesn't block it (image pulls aren't governed by it).
#
# - Pull requests build every arch with --test (no push) so a broken config/build/Dockerfile is
#   caught before merge.
# - Publishing a GitHub Release builds and pushes the per-arch images, tagged with the config.yaml
#   version, to the registry named by `image:` in config.yaml.

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build:
    name: Build add-on images
    if: github.repository == 'mega-yfue/ha-eufy-sdk-addon'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Enable multi-arch emulation (binfmt)
        run: docker run --rm --privileged tonistiigi/binfmt --install arm64

      - name: Log in to ghcr.io
        if: github.event_name == 'release'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build add-on (push on release, --test otherwise)
        run: |
          set -euo pipefail
          mounts=(-v /var/run/docker.sock:/var/run/docker.sock:ro -v "$(pwd)":/data)
          flags=(--all --target /data/eufy_sdk_bridge)
          if [[ "${{ github.event_name }}" == "release" ]]; then
            # docker login wrote credentials here; the builder needs them to push.
            mounts+=(-v "$HOME/.docker":/root/.docker:ro)
          else
            flags+=(--test)
          fi
          docker run --rm --privileged "${mounts[@]}" \
            ghcr.io/home-assistant/amd64-builder "${flags[@]}"
